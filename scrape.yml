name: みんレポ自動スクレイピング

on:
  schedule:
    # 毎日 08:30（日本時間）
    - cron: '30 8 * * *'
      timezone: 'Asia/Tokyo'

  workflow_dispatch:
    inputs:
      mode:
        description: '実行モード'
        required: false
        default: 'normal'
        type: choice
        options:
          - normal
          - backfill
      target_date:
        description: '取得対象日付 (例: 2026-09-17)。指定時はmodeより優先'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: mihara-scraper
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      PYTHONUNBUFFERED: '1'
      EXPECTED_MACHINE_COUNT: '551'
      BACKFILL_REPORTS: '6'
      INDIVIDUAL_RETRIES: '2'
      INDIVIDUAL_WAIT_SECONDS: '0.7'

    steps:
      - name: リポジトリをチェックアウト
        uses: actions/checkout@v4

      - name: Pythonセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements-scraper.txt

      - name: スクレイパー依存関係をインストール
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-scraper.txt
          python -m playwright install --with-deps chromium

      - name: スクレイピング実行
        env:
          SPREADSHEET_ID: ${{ secrets.SPREADSHEET_ID }}
          GCP_CREDENTIALS: ${{ secrets.GCP_CREDENTIALS }}
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "08:30 JST 定期実行: 最新取得 + 最近の不足データ補完"
            python scraper_actions.py normal
            exit $?
          fi

          MODE="${{ github.event.inputs.mode }}"
          TARGET="${{ github.event.inputs.target_date }}"

          if [ -n "$TARGET" ]; then
            echo "日付指定: $TARGET"
            python scraper_actions.py "$TARGET"
          elif [ "$MODE" = "backfill" ]; then
            echo "不足データ補完モード"
            python scraper_actions.py backfill
          else
            echo "通常モード"
            python scraper_actions.py normal
          fi
